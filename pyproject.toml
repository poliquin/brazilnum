[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brazilnum"
version = "0.8.9"
authors = [
  { name="Chris Poliquin", email="cpoliquin@hbs.edu" },
]
license = {file = "LICENSE"}
description = "Validate Brazilian CNPJ, CEI, CPF, PIS/PASEP, CEP, and municipal numbers"
readme = "README.rst"
requires-python = ">=3.8"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Utilities"
]
keywords=["brazil", "brasil", "cnpj", "cei", "cpf", "pis", "pasep", "cep"]
dependencies = []

[project.urls]
Homepage = "https://github.com/poliquin/brazilnum"

pythonpath = [
    "src"
]
testpaths = [
    "test",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brazilnum"]
